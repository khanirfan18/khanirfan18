name: metrics
on:
  schedule:
    - cron: "0 */6 * * *"   # regenerate every 6 hours
  workflow_dispatch:         # lets you trigger it manually anytime
  push:
    branches: [ main ]

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Card 1: commits / PRs / issues / rank (stars hidden)
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide=stars&show_icons=true&hide_border=true&theme=radical
          path: cards/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Card 2: top languages breakdown
      - name: Generate top-langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&theme=radical
          path: cards/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Card 3: lines of code added/removed
      - name: Generate lines-of-code card
        uses: lowlighter/metrics@latest
        with:
          filename: cards/lines.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          plugin_lines: yes
          config_timezone: Asia/Kolkata

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cards/*.svg
          git commit -m "Update stat cards" || exit 0
          git fetch origin main
          git rebase origin/main
          git push
