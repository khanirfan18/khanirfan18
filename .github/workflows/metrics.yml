name: metrics
on:
  schedule:
    - cron: "0 */6 * * *"   # regenerate every 6 hours
  workflow_dispatch:         # lets you trigger it manually anytime
  push:
    branches: [ main ]

jobs:
  update-cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Card 1: commits / PRs / issues / rank (stars hidden, dark GitHub theme)
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide=stars&show_icons=true&hide_border=true&theme=github_dark&card_width=260
          path: cards/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Card 2: top languages as a small round (pie) chart, dark GitHub theme
      - name: Generate top-langs card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&hide_border=true&theme=github_dark&card_width=260
          path: cards/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Card 3: PRs + issues opened (repos, commits, stars, rank hidden), dark GitHub theme
      - name: Generate PRs/issues card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide=stars,commits,rank&hide_border=true&theme=github_dark&card_width=260
          path: cards/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cards/*.svg
          git commit -m "Update stat cards" || exit 0
          git fetch origin main
          git rebase origin/main
          git push
